openapi: 3.1.0
info:
  title: Flows Internal Stream Messages API — Streaming Components Delta
  version: 1.1.0
  license:
    name: Proprietary
    url: https://weni.ai
  description: >
    Additive delta over POST /api/v2/internals/messages/stream in flows
    (temba/api/v2/internals/msgs/views.py). Persists streamed Shopping Assistant
    assistant turns (including quick_replies, list_message, and cta_message) in
    Flows DB without triggering Mailroom/Courier delivery.
servers:
  - url: https://flows.weni.ai
    description: Flows REST API base URL (injected via FLOWS_REST_ENDPOINT in nexus-ai)
paths:
  /api/v2/internals/messages/stream:
    post:
      operationId: createStreamedMessageRecord
      summary: Persist a streamed message with optional interactive components (DB-only)
      description: >
        Called by nexus-ai after completing a gRPC streamed turn on Shopping
        Assistant (including turns with quick_replies, list_message, or
        cta_message). Creates a Msg record in Flows without enqueuing Mailroom
        or Courier delivery. Validates component fields at the DRF serializer
        boundary (Flows Constitution IX) and supports bounded retry via
        Idempotency-Key (Flows/Nexus Constitution XI).
      security:
        - ModuleJWT: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional deduplication key (recommended: nexus-ai gRPC msg_id or
            turn_id UUID), scoped to project_uuid and retained for 24h.
            Replaying the same key with the same payload after success returns
            200 with the original created ids; reusing the key with a different
            payload, or while the first request with that key is still being
            processed, returns 409 with a machine-readable code. Any non-success
            response releases the key, so a retry with the same key is processed
            again. A value that is blank after trimming or longer than 128
            characters is treated as absent (no deduplication, no 400); the
            producer MUST send 1–128 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
          example: "9f2a4c1b7e8d0123"
        - name: X-Correlation-ID
          in: header
          required: false
          description: >
            Opaque correlation identifier generated by nexus-ai per turn and
            propagated to Flows structured logs and Sentry tags.
          schema:
            type: string
            minLength: 1
            maxLength: 128
          example: "turn-8f3e1a90"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamMessageCreateRequest"
            examples:
              quickReplies:
                summary: Streamed answer with quick replies
                value:
                  project_uuid: "11111111-2222-3333-4444-555555555555"
                  channel_uuid: "c4dc40fa-37e0-4147-a379-a3e8ffd23f80"
                  urns: ["ext:shopper-42@"]
                  direction: "out"
                  msg:
                    text: "Boa notícia: ainda dá para receber hoje no seu endereço. Escolha uma das opções de entrega abaixo:"
                    quick_replies:
                      - "Expressa · até 2h"
                      - "Agendada · 18h–20h"
                      - "Retirar na loja"
              listAndCtaMultiComponent:
                summary: Streamed answer with list message and CTA (BD-006)
                value:
                  project_uuid: "11111111-2222-3333-4444-555555555555"
                  channel_uuid: "c4dc40fa-37e0-4147-a379-a3e8ffd23f80"
                  urns: ["ext:shopper-42@"]
                  direction: "out"
                  msg:
                    text: "Aqui estão as ofertas e o link para acompanhar seu pedido:"
                    interaction_type: "list"
                    list_message:
                      button_text: "Ver 9 ofertas"
                      item_count: 9
                      list_items:
                        - uuid: "8c5d9f42-1f4e-4b72-a1a2-0e4a1a1d0001"
                          title: "Café em grãos 500g"
                          description: "R$ 34,90 no Clube Aurora"
                    cta_message:
                      display_text: "Acompanhar pedido"
                      url: "https://loja.example/pedidos/48213/rastreio"
              textlessComponent:
                summary: Streamed answer with component and empty text (FR-028)
                value:
                  project_uuid: "11111111-2222-3333-4444-555555555555"
                  channel_uuid: "c4dc40fa-37e0-4147-a379-a3e8ffd23f80"
                  urns: ["ext:shopper-42@"]
                  direction: "out"
                  msg:
                    text: ""
                    quick_replies:
                      - "Sim"
                      - "Não, só isso"
      responses:
        "201":
          description: Message record(s) persisted in Flows DB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMessageCreateResponse"
              examples:
                created:
                  value:
                    ids: [987654321]
        "200":
          description: Idempotent replay of a previously accepted Idempotency-Key with matching payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMessageCreateResponse"
              examples:
                replayed:
                  value:
                    ids: [987654321]
        "400":
          description: Validation error in request body or msg component fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidCtaUrl:
                  summary: Invalid CTA URL
                  value:
                    msg:
                      cta_message:
                        url: ["Enter a valid http(s) URL."]
                emptyQuickReplies:
                  summary: Empty quick_replies list
                  value:
                    msg:
                      quick_replies: ["Ensure this field has at least 1 element."]
                unknownComponentKey:
                  summary: Key not declared in the shared component schema
                  value:
                    msg:
                      cta_message: ["Unexpected field: foo."]
                missingContact:
                  summary: Neither contact_uuid nor a non-empty urns list
                  value:
                    non_field_errors: ["Must provide either contact_uuid or urns"]
        "403":
          description: >
            Missing, invalid or expired Bearer module JWT, or a module JWT that
            does not authorize writes for the requested project_uuid. This
            endpoint does not return 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingToken:
                  value:
                    detail: "Missing or invalid Authorization header."
                expiredToken:
                  value:
                    detail: "Token expired."
                forbiddenTenant:
                  value:
                    detail: "You do not have permission to perform this action."
        "404":
          description: Project not found for project_uuid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                projectNotFound:
                  value:
                    error: "Project not found"
        "409":
          description: >
            Idempotency-Key reused with a different request payload
            (code idempotency_conflict, final: the caller must not retry with
            this key) or still being processed by an earlier request with the
            same key (code idempotency_in_progress, transient: the caller may
            retry within its bounded retry budget).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    code: "idempotency_conflict"
                    error: "Idempotency-Key reused with different body"
                idempotencyInProgress:
                  value:
                    code: "idempotency_in_progress"
                    error: "Request with this Idempotency-Key is already being processed"
components:
  securitySchemes:
    ModuleJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Internal Weni module JWT issued by nexus-ai (JWTUsecase.generate_broadcast_jwt_token)
        scoped to project_uuid. Verified server-side by Flows (JWTAuthMixinRequired).
        Every authentication or tenant-scope failure returns 403.
  schemas:
    StreamMessageCreateRequest:
      type: object
      description: >
        At least one contact identifier is required: contact_uuid, or a
        non-empty urns list. An empty urns list is accepted when contact_uuid
        is present.
      required:
        - project_uuid
      anyOf:
        - required:
            - contact_uuid
        - required:
            - urns
          properties:
            urns:
              minItems: 1
      properties:
        project_uuid:
          type: string
          format: uuid
        direction:
          type: string
          enum: ["in", "out", "I", "O"]
          default: "out"
        contact_uuid:
          type: string
          format: uuid
        urns:
          type: array
          items:
            type: string
            minLength: 1
        channel_uuid:
          type: string
          format: uuid
        text:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        msg:
          $ref: "#/components/schemas/StreamMsgPayload"
        attachments:
          type: array
          items:
            type: string
            format: uri
        status:
          type: ["string", "null"]
        visibility:
          type: ["string", "null"]
        created_on:
          type: string
          format: date-time
        sent_on:
          type: string
          format: date-time
        labels:
          type: array
          items:
            type: string
            format: uuid
    StreamMsgPayload:
      type: object
      description: >
        Structured message payload stored in Msg.metadata; text is also mirrored
        to Msg.text. quick_replies, list_message and cta_message are defined only
        in the shared component schema; their objects (list_message,
        list_items[], cta_message) and header are closed, so an undeclared key
        inside them returns 400. Keys at the msg level stay open for
        compatibility with existing callers.
      properties:
        text:
          type: string
        interaction_type:
          type: string
          enum: ["list", "cta_url"]
        quick_replies:
          $ref: "./components-shared.schema.json#/$defs/quickReplies"
        list_message:
          $ref: "./components-shared.schema.json#/$defs/listMessage"
        cta_message:
          $ref: "./components-shared.schema.json#/$defs/ctaMessage"
        header:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              const: "text"
            text:
              type: string
        footer:
          type: string
    StreamMessageCreateResponse:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
    ValidationErrorResponse:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
    IdempotencyErrorResponse:
      type: object
      required:
        - code
        - error
      properties:
        code:
          type: string
          enum: ["idempotency_conflict", "idempotency_in_progress"]
        error:
          type: string
